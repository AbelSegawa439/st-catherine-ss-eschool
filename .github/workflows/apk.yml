name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm install @capacitor/core @capacitor/android @capacitor/cli
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync
      - name: Assemble debug APK
        working-directory: apps/pwa/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: st-catherine-ss
          path: apps/pwa/android/app/build/outputs/apk/debug/app-debug.apk